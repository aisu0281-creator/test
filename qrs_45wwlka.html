<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Verification</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#00ff66;font-family:Consolas,Monaco,monospace}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:min(900px,94vw);padding:24px}
.card{border:1px solid #00ff66;background:#020a04;box-shadow:0 0 30px #00ff6630;padding:22px}
.top{font-size:13px;color:#79ff9d;margin-bottom:18px}
.title{font-size:clamp(22px,5vw,40px);margin:0 0 8px;text-shadow:0 0 12px #00ff66}
.sub{color:#8abf99;font-size:13px;margin-bottom:24px}
.bar{height:8px;background:#102015;border:1px solid #164d27;margin:14px 0 22px}
.fill{height:100%;width:0;background:#00ff66;box-shadow:0 0 12px #00ff66;transition:width .5s}
.log{height:310px;overflow:hidden;background:#000;border:1px solid #12351d;padding:14px;font-size:13px;line-height:1.75}
.line{opacity:.95}.ok{color:#00ff66}.warn{color:#ffd43b}.danger{color:#ff5151}
.cursor{display:inline-block;width:8px;height:15px;background:#00ff66;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
.note{margin-top:14px;font-size:11px;color:#52755c}
button{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">SYSTEM SECURITY GATEWAY // CONNECTION ESTABLISHED</div>
    <h1 class="title">SECURITY VERIFICATION</h1>
    <div class="sub">不正アクセス防止のため、端末のセキュリティ状態を確認しています。</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="log" id="log"></div>
    <div class="note">この画面は演出用です。実際の端末情報・個人情報・認証情報は取得または送信していません。</div>
  </div>
</div>
<script>
const log=document.getElementById('log');
const fill=document.getElementById('fill');

const fakeIP = () => {
  const a=[23,45,61,103,126,133,153,172,182,210];
  return `${a[Math.floor(Math.random()*a.length)]}.${10+Math.floor(Math.random()*240)}.${10+Math.floor(Math.random()*240)}.${10+Math.floor(Math.random()*240)}`;
};
const fakeID=()=>Math.random().toString(16).slice(2,10).toUpperCase();

const lines=[
  ["[INIT] Secure connection established.","ok"],
  ["[SCAN] Checking browser security modules...","ok"],
  ["[SCAN] Checking session integrity...","ok"],
  ["[INFO] Device fingerprint detected: "+fakeID(),"warn"],
  ["[INFO] Network endpoint: "+fakeIP(),"warn"],
  ["[SCAN] Searching for active authentication sessions...","ok"],
  ["[SCAN] Verifying security tokens...","ok"],
  ["[WARN] Suspicious session state detected.","warn"],
  ["[SCAN] Escalating verification level...","danger"],
  ["[AUTH] Security challenge initialized.","ok"],
  ["[PROC] Analyzing local security state...","ok"],
  ["[PROC] Verification 87% complete...","warn"],
  ["[PROC] Verification 94% complete...","warn"],
  ["[PROC] Finalizing security report...","ok"],
  ["[DONE] Verification process completed.","ok"],
  ["[NOTICE] Security status recorded.","danger"]
];

let i=0;
function addLine(){
  if(i>=lines.length){
    const p=document.createElement('div');
    p.innerHTML='<span class="ok">root@security-gateway:~$ </span><span class="cursor"></span>';
    log.appendChild(p);
    log.scrollTop=log.scrollHeight;
    return;
  }
  const [txt,cls]=lines[i++];
  const p=document.createElement('div');
  p.className='line '+cls;
  p.textContent=txt;
  log.appendChild(p);
  log.scrollTop=log.scrollHeight;
  fill.style.width=Math.min(100, Math.round(i/lines.length*100))+'%';
  setTimeout(addLine, 650 + Math.random()*650);
}
setTimeout(addLine,700);
</script>
</body>
</html>
